name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate syntax and unit tests
        run: npm run ci

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp -R web/. _site/
          cp -R packages _site/packages

      - name: Resolve shared-core paths for the Pages artifact
        run: |
          find _site/assets/js/modules -name '*.js' -exec sed -i 's#../../../../packages/core/#../../../packages/core/#g' {} +
          sed -i 's#\.\./packages/#./packages/#g' _site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
