<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayloadForge</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --bg: #0f172a; --surface: #111827; --surface-hover: #1f2937;
      --border: #334155; --primary: #ea6b3b; --primary-hover: #f27c52;
      --text: #f8fafc; --muted: #94a3b8; --danger: #ef4444;
    }
    body { width: 360px; margin: 0; background: var(--bg); color: var(--text); }
    body[data-density="compact"] { font-size: 13px; }
    .view { padding: 16px; }
    .view[hidden] { display: none; }
    .topbar, .preferences-header, .row, .history-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 18px; } h2 { font-size: 17px; } h3 { font-size: 12px; }
    .subtitle, small, .hint { color: var(--muted); font-size: 11px; line-height: 1.45; }
    .subtitle { margin-top: 4px; }
    .icon-button, button {
      min-height: 34px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--surface-hover); color: var(--text); cursor: pointer; font: inherit;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .icon-button { width: 34px; padding: 0; font-size: 17px; }
    button:hover { border-color: var(--primary); background: #26313e; transform: translateY(-1px); box-shadow: 0 5px 14px rgb(234 107 59 / 16%); }
    textarea {
      width: 100%; min-height: 96px; box-sizing: border-box; margin-top: 12px; padding: 10px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
      color: var(--text); font: var(--editor-font-size, 12px)/1.45 ui-monospace, Consolas, monospace; resize: vertical;
    }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 9px 0; }
    .actions button, #copy { font-size: 11px; } #copy { width: 100%; }
    #status { display: block; min-height: 18px; margin-top: 8px; color: #8ed1c0; font-size: 11px; }
    .preferences-header { padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .title-wrap { display: flex; align-items: center; gap: 10px; }
    .settings-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid color-mix(in srgb, var(--primary) 55%, var(--border)); border-radius: 10px; color: var(--primary); }
    section { margin-top: 16px; } section + section { padding-top: 16px; border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent); }
    .section-label { margin-bottom: 9px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field, .font-card, .history-card { padding: 10px; border: 1px solid var(--border); border-radius: 11px; background: color-mix(in srgb, var(--surface) 86%, transparent); }
    label > span { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 650; }
    select { width: 100%; min-height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); }
    select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid rgb(234 107 59 / 30%); outline-offset: 2px; }
    .font-card { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    output { padding: 4px 6px; border-radius: 6px; background: rgb(234 107 59 / 12%); color: var(--primary); font: 700 11px ui-monospace, monospace; }
    input[type="range"] { width: 100%; grid-column: 1 / -1; accent-color: var(--primary); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .switch-list { overflow: hidden; border: 1px solid var(--border); border-radius: 11px; }
    .switch-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .switch-row:last-child { border: 0; }.switch-row:hover { background: var(--surface-hover); }
    .switch-row span:first-child { margin: 0; }.switch-row strong { display: block; font-size: 11px; }.switch-row small { display: block; margin-top: 3px; }
    .switch-row input { position: absolute; opacity: 0; }
    .switch { width: 38px; height: 22px; border-radius: 999px; background: #334155; transition: background-color .18s ease, box-shadow .18s ease; }
    .switch::after { display: block; width: 14px; height: 14px; margin: 4px; border-radius: 50%; background: var(--muted); content: ""; transition: background-color .18s ease, transform .18s ease; }
    .switch-row input:checked + .switch { background: var(--primary); box-shadow: 0 0 12px rgb(234 107 59 / 38%); }.switch-row input:checked + .switch::after { transform: translateX(16px); background: white; }
    .history-card { display: grid; gap: 10px; }.history-header { justify-content: flex-start; }.history-icon { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 9px; background: rgb(234 107 59 / 12%); color: var(--primary); }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }.metric { padding: 7px; border-radius: 7px; background: var(--surface-hover); }.metric small { display: block; }.metric strong { display: block; margin-top: 2px; font: 700 11px ui-monospace, monospace; }
    .danger { border-color: #ef4444; background: #7f1d1d; color: #ffffff; font-size: 11px; }
    @media (prefers-reduced-motion: reduce) {
      .icon-button, button, .switch, .switch::after { transition-duration: 0.01ms; }
    }
  </style>
</head>
<body data-density="comfortable">
  <main id="tool-view" class="view">
    <header class="topbar"><div><h1>PayloadForge</h1><p class="subtitle">Transform text locally.</p></div><button id="preferences-toggle" class="icon-button" type="button" aria-label="Open preferences">⚙</button></header>
    <textarea id="input" aria-label="Input text" placeholder="Paste text or use the context menu selection…"></textarea>
    <div class="actions"><button type="button" data-action="format">Format JSON</button><button type="button" data-action="base64">Base64</button><button type="button" data-action="redact">Redact secrets</button></div>
    <textarea id="output" aria-label="Result" readonly placeholder="Result appears here…"></textarea>
    <button type="button" id="copy">Copy result</button><output id="status" aria-live="polite"></output>
  </main>
  <main id="preferences-view" class="view" hidden>
    <header class="preferences-header"><div class="title-wrap"><span class="settings-mark" aria-hidden="true">⚙</span><div><h2>Preferences</h2><p class="subtitle">Personalize your local workspace.</p></div></div><button id="preferences-close" class="icon-button" type="button" aria-label="Close preferences">×</button></header>
    <section><p class="section-label">Appearance</p><div class="grid"><label class="field"><span>Theme</span><select id="pref-theme"><option value="dark">Dark</option><option value="light">Light</option><option value="system">System</option></select></label><label class="field"><span>Density</span><select id="pref-density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label></div></section>
    <section><p class="section-label">Editor</p><div class="font-card"><div><strong>Font size</strong><p class="hint">Adjust editor readability.</p></div><output id="font-value">13 px</output><label class="sr-only" for="pref-font-size">Editor font size</label><input id="pref-font-size" type="range" min="11" max="20" value="13"></div><div class="switch-list" style="margin-top:8px"><label class="switch-row"><span><strong>Wrap lines</strong><small>Prevent horizontal scrolling.</small></span><input id="pref-wrap" type="checkbox" role="switch" aria-checked="false"><span class="switch"></span></label><label class="switch-row"><span><strong>Syntax highlighting</strong><small>Use enhanced editor rendering.</small></span><input id="pref-highlight" type="checkbox" role="switch" aria-checked="true" checked><span class="switch"></span></label></div></section>
    <section><p class="section-label">Data & privacy</p><label class="switch-row" style="border:1px solid var(--border);border-radius:11px"><span><strong>Local history</strong><small>Stores action and timestamp only.</small></span><input id="pref-history" type="checkbox" role="switch" aria-checked="false"><span class="switch"></span></label><article class="history-card" style="margin-top:8px"><div class="history-header"><span class="history-icon" aria-hidden="true">◷</span><div><strong>Local history</strong><p id="history-status" class="hint">Disabled; nothing is stored.</p></div></div><div class="metrics"><div class="metric"><small>Actions</small><strong id="history-count">0</strong></div><div class="metric"><small>Space</small><strong id="history-size">0 B</strong></div><div class="metric"><small>Updated</small><strong id="history-updated">—</strong></div></div><button id="history-clear" class="danger" type="button">Clear history</button></article></section>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
